<title>Fruit Ball Z</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Luckiest+Guy&family=Nunito:wght@600;800&display=swap">
<style>
  /* Une seule colonne centrée façon écran de téléphone, sur fond « ciel d'orage » de l'épisode */
  :root {
    color-scheme: dark;
    --night: #120C1F;
    --plum: #2A1636;
    --ink: #F6EFE6;
    --muted: #BFAFC6;
    --apple: #D22B2B;
    --gold: #FFD23F;
    --display: "Bangers", "Impact", "Arial Black", sans-serif;
    --title: "Luckiest Guy", "Arial Black", sans-serif;
    --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  html, body { background: var(--night); color: var(--ink); }
  body {
    font-family: var(--body);
    background: radial-gradient(ellipse 80% 50% at 50% 0%, var(--plum), var(--night) 70%) var(--night);
    min-height: 100%;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 28px 40px;
  }
  main { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  header { text-align: center; display: flex; flex-direction: column; gap: 4px; }
  h1 {
    font-family: var(--display); font-weight: 400; margin: 0;
    font-size: clamp(3rem, 14vw, 4.4rem); line-height: 0.95; letter-spacing: 0.04em;
    color: var(--gold); -webkit-text-stroke: 3px #000; paint-order: stroke fill;
    text-shadow: 0 5px 0 var(--apple); text-wrap: balance;
  }
  .ep { font-family: var(--title); font-size: 1.15rem; letter-spacing: 0.08em; color: var(--ink); margin: 0; }
  .frame {
    position: relative; width: 100%; max-width: 100%; aspect-ratio: 9 / 16;
    border-radius: 22px; overflow: hidden; background: #000;
    border: 3px solid #000; box-shadow: 0 0 0 2px var(--apple), 0 18px 50px rgba(210, 43, 43, 0.28);
  }
  video { width: 100%; height: 100%; display: block; object-fit: contain; background: #000; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 0; padding: 0; list-style: none; }
  .meta li {
    font-size: 0.8rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--muted); border: 1.5px solid #4A3458; border-radius: 999px; padding: 4px 10px;
    font-variant-numeric: tabular-nums;
  }
  .cast { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .cast div { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; min-width: 0; }
  .dot { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #000; }
  .cast b { font-family: var(--title); font-weight: 400; font-size: 0.95rem; letter-spacing: 0.02em; }
  .cast span { font-size: 0.78rem; color: var(--muted); line-height: 1.3; }
  p.next { text-align: center; margin: 4px 0 0; font-family: var(--title); color: var(--gold); font-size: 1.05rem; letter-spacing: 0.04em; }
  .dl {
    align-self: center; font-family: var(--title); font-size: 1rem; letter-spacing: 0.04em; text-decoration: none;
    color: #000; background: var(--gold); border: 3px solid #000; border-radius: 999px; padding: 10px 22px;
    box-shadow: 0 4px 0 var(--apple); cursor: pointer;
  }
  .dl:disabled { opacity: 0.6; cursor: progress; }
  .dl:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  video:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
</style>

<main>
  <header>
    <h1>Fruit Ball Z</h1>
    <p class="ep">Épisode 1 · L'arrivée de Raditz</p>
  </header>

  <div class="frame">
    <video id="ep1" src="episode1_fruitballz.mp4" controls playsinline preload="metadata" poster="poster.jpg"></video>
  </div>

  <ul class="meta">
    <li>39 s</li>
    <li>1080 × 1920</li>
    <li>VF sous-titrée</li>
  </ul>

  <section class="cast" aria-label="Personnages">
    <div><i class="dot" style="background:#D22B2B"></i><b>Pomgoku</b><span>Pomme naïve au grand cœur</span></div>
    <div><i class="dot" style="background:#BFD94A"></i><b>Petit-Poirsan</b><span>Son fils, enlevé</span></div>
    <div><i class="dot" style="background:#4C2F18"></i><b>Raditz</b><span>Plantain venu de l'espace</span></div>
  </section>

  <button class="dl" id="dl" type="button" hidden>Télécharger en MP4</button>

  <p class="next">À suivre…</p>
</main>

<script>
  // Bouton MP4 : n'apparaît que si la page peut proposer un téléchargement
  (async () => {
    const downloads = await window.claude?.use?.("downloads");
    if (!downloads) return;
    const btn = document.getElementById("dl");
    btn.hidden = false;
    btn.addEventListener("click", async () => {
      btn.disabled = true; btn.textContent = "Préparation…";
      try {
        const data = await (await fetch("episode1_fruitballz.mp4")).blob();
        await downloads.save({ filename: "episode1_fruitballz.mp4", data });
      } catch (e) {
        if (e && e.code === "unavailable") btn.hidden = true;
      } finally {
        btn.disabled = false; btn.textContent = "Télécharger en MP4";
      }
    });
  })();
</script>
